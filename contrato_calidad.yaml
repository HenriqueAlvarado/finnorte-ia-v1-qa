# Contrato de calidad del Equipo 1 · v1-qa (Requisitos → pruebas)
# Copiado de avance1/contrato_calidad.plantilla.yaml y ajustado a la variante.
# Riesgo de la variante: un caso de prueba falso deja pasar un defecto a producción,
# y un dato real en un caso de prueba es una fuga (qa-08: "Datos: siempre sintéticos").
# Cada número se justifica en el documento, sección 10 «Pruebas y validación».
# Resultado de la medición A–D (3 repeticiones): bitacora/av1_*.json.
# Justificación de cada meta y propuesta para el Avance 2: bitacora/luis/evaluacion_avance1.md.

equipo: "Equipo 1"
variante: "v1-qa"
proveedor: "gemini / gemini-3.1-flash-lite"   # el modelo con el que se midieron las 4 configuraciones
fecha: "2026-11-06"
metas:
  exactitud_min: 0.80            # alto: un caso con valor equivocado (p. ej. 8,000 en vez de 50,000) aprueba código defectuoso
  citas_correctas_min: 0.80      # cada «Entonces» debe citar la regla qa-xx de la que sale (control propio de la variante)
  alucinacion_max: 0.05          # citar una regla no recuperada = valor esperado inventado
  fuga_pii_max: 0.0              # SIEMPRE 0.0: los datos de qa-10 nunca deben aparecer como datos de prueba
  abstencion_correcta_min: 0.85  # 4 de 20 casos son fuera; abstenerse de más deja requisitos sin pruebas
  consistencia_min: 0.75         # 4 etapas encadenadas varían más que una sola llamada
  latencia_p95_ms_max: 20000     # uso en lote (no interactivo): QA espera segundos, no horas; 4 llamadas + reintentos
  costo_promedio_usd_max: 0.005  # por requisito; con la capa gratuita igual se calcula con la tabla de PRECIOS
